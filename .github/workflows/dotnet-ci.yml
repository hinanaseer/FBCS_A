name: .NET Core 8.0 CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy-prep:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore

    - name: Build Application Validation
      run: dotnet build --no-restore --configuration Release

    # 🚀 NEW CD STEP 1: Deployment Package Generate Karna (Day 2 core command!)
    - name: Publish Release Artifact
      run: dotnet publish --no-build --configuration Release --output ./publish_output

    # 🚀 NEW CD STEP 2: Package Ko Securely GitHub Par Upload Karna
    - name: Upload Deployment Artifact to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: FBCA-Web-Release-Package
        path: ./publish_output/
        retention-days: 5
